services:
  audio:
    image: audio
    container_name: yt-audio-downloader
    build:
      context: .
      dockerfile: ./Dockerfile.audio
    volumes:
      - ./:/mydir
  video:
    image: video
    container_name: yt-video-downloader
    build:
      context: .
      dockerfile: ./Dockerfile.video
    volumes:
      - ./:/mydir


 
